[package]
name = "spicemanager"
version = "0.1.0"
description = "Third-party utility for managing Spotify + Spicetify setups."
authors = ["Elias Onsihuay <elias@kodhu.dev>"]
edition = "2021"
license = "MIT"

[lib]
name = "spicemanager"
path = "src/lib.rs"

[[bin]]
name = "spicemanager"
path = "src/bin/spicemanager.rs"

[[bin]]
name = "spicemanager-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
